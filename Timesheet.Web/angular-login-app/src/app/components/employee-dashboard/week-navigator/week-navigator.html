<div class="wk-nav">
  <button class="wk-btn" (click)="prevWeek()" aria-label="Previous week">‹</button>
  <div class="wk-label" title="{{displayLabel}}">{{ displayLabel }}</div>
  <button class="wk-btn" (click)="nextWeek()" aria-label="Next week">›</button>
  <button class="wk-today" (click)="goToToday()">Today</button>
</div>
