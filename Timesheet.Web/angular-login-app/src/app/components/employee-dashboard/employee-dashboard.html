<div class="timesheet card">
  <header class="ts-header">
    <div class="ts-left">
      <h2 class="ts-title">Timesheet</h2>
    </div>

    <div class="ts-right">
      <div class="controls">
        <button class="btn ghost" (click)="addRow()">+ Add Row</button>
        <button class="btn secondary btn-draft" (click)="saveDraft()">Save Draft</button>
        <button class="btn primary btn-submit" (click)="submitTimesheet()">Submit</button>
      </div>

      <div class="nav-and-user">
        <app-week-navigator (weekChange)="onWeekChange($event)"></app-week-navigator>
        <select class="user-select" [(ngModel)]="selectedUser" (ngModelChange)="onUserChange($event)"
          name="selectedUser">
          <option value="">Select user</option>
          @for (u of users; track u.id) {
          <option [value]="u.id">{{ u.name }}</option>
          }
        </select>
      </div>
    </div>
  </header>

  <div class="table-wrap">
    <table class="timesheet-table" cellpadding="6" cellspacing="0">
      <thead>
        <tr>
          <th class="col-project">Project</th>
          <th class="col-project-name">Project name</th>
          <th class="col-desc">Description</th>

          @for (d of weekDays; track d.short) {
          <th class="col-day">{{ d.label }} </th>
          }

        </tr>
      </thead>

      <tbody>
        @for (r of rows; track r.id ?? $index; let i = $index) {
        <tr>


          <td class="project-col">
            <select class="project-select" [(ngModel)]="r.code" name="project-{{i}}"
              (ngModelChange)="onProjectChange($event, r)" [disabled]="isEntryApproved(r)">
              <option value="">-- Select project --</option>
              @for (p of projects; track p.id) {
              <option [value]="p.id">{{ p.code }}</option>
              }
            </select>
          </td>

          <td class="project-name-col"><input class="input-plain" [(ngModel)]="r.projectName"
              [disabled]="isEntryApproved(r)" placeholder="Project name" /></td>

          <td class="desc-col"><input class="input-plain" [(ngModel)]="r.description" placeholder="Description"
              [disabled]="isEntryApproved(r)" /></td>

          @for (d of weekDays; track d.short) {
          <td class="hours-col">
            <input class="hours" type="number" min="0" max="24" step="0.25" [(ngModel)]="r.hours[d.date]"
              name="hours-{{i}}-{{d.date}}" (ngModelChange)="onHoursChange($event, r, d.date)" placeholder="0"
              [disabled]="isEntryApproved(r)" />
          </td>
          }
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
